# Deploy static site to GitHub Pages (no Jekyll build).
#
# FIRST TIME ONLY — or the deploy job will fail:
# GitHub → this repository → Settings → Pages → "Build and deployment"
# → Source: choose "GitHub Actions" → Save. Then push again or re-run workflow.
#
# Site URL: https://<your-username>.github.io/<repository>/

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
